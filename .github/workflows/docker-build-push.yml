name: Build, Test and Push Docker Images

on:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches: [ main, cinema ]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build compose images
        run: docker compose build

      - name: Start compose stack
        run: docker compose up -d

      - name: Wait for services
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8000/health \
              && curl -fsS http://localhost:8081/api/movies/health \
              && curl -fsS http://localhost:8082/api/events/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run API tests
        run: |
          cd tests/postman
          npm ci || npm install
          npm run test:docker

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push monolith
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./src/monolith
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/monolith:latest

      - name: Build and push movies-service
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/movies-service:latest

      - name: Build and push proxy-service
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/proxy-service:latest

      - name: Build and push events-service
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/events-service:latest

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
